[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-insights"
version = "0.1.0"
description = "Group capstone: world weather map, city close-ups and attraction visit advice on the OpenWeatherMap API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "plotly>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.55",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
